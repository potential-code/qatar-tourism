# Production stack for Dokploy: one static nginx container, no backend and no database (the
# mockup keeps its demo data in each visitor's browser).
#
# Dokploy: Create Service > Compose, point it at this file, then add a domain for service
# `web`, container port 80. Do not add `ports:`: Traefik reaches the container over
# dokploy-network.
#
# Set BASIC_AUTH_USER and BASIC_AUTH_PASS in Dokploy > Environment. If either is missing the
# site answers 503 (fail closed). /healthz is always open.
#
# To run it outside Dokploy:
#   docker network create dokploy-network        # once
#   BASIC_AUTH_USER=demo BASIC_AUTH_PASS=change-me docker compose up --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEMO_REFERENCE_DATE: ${VITE_DEMO_REFERENCE_DATE:-}
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
      BASIC_AUTH: ${BASIC_AUTH:-}
    expose:
      - "80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

networks:
  # Created by Dokploy on the host. Traefik only routes to containers on it.
  dokploy-network:
    external: true
