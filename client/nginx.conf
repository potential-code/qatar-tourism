server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    server_tokens off;

    # Security headers. `always` adds them to error responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Content-Security-Policy is deliberately not set here: the API origin (VITE_API_URL) is
    # baked in at build time and differs per environment, and this file is shared by all of
    # them. When deploying, set it at the proxy (Dokploy/Traefik) or add a line like:
    #   add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.example.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # 'unsafe-inline' for styles is needed by the chart and toast libraries' inline styles.

    # Client-side routing: unknown paths get the SPA shell so a hard refresh works.
    location / {
        try_files $uri /index.html;
    }

    # Content-hashed by Vite, so safe to cache forever. add_header in a location replaces the
    # server-level headers, so repeat them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # The shell must never be cached, or users keep loading stale asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
