<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recovering a difficult service moment | Qatar Tourism Academy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="topbar">
      <div class="topbar__inner">
        <p class="wordmark">Qatar Tourism <span>Academy</span></p>
        <div class="topbar__right">
          <span class="pill">SCORM 2004 sample package</span>
          <button type="button" class="btn btn--small btn--ghost" data-exit>Save and exit</button>
        </div>
      </div>
    </header>

    <div id="preview-banner" class="banner" role="note" hidden>
      <span class="banner__icon" aria-hidden="true">i</span>
      <span><strong>Preview mode: no LMS connection.</strong> Everything works, but progress and scores are not saved.</span>
    </div>

    <main class="shell">
      <div class="intro-head">
        <h1 class="title">Recovering a difficult service moment</h1>
        <p class="subtitle">Interactive package • 10 minutes • SCORM 2004 sample package</p>
      </div>
      <div id="app"></div>
      <p id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
      <p id="status-line" class="status-line" role="status" hidden></p>
    </main>

    <script src="runtime.js"></script>
    <script src="content.js"></script>
  </body>
</html>
