server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/xml text/vtt application/javascript application/json image/svg+xml;

    # Unauthenticated, for the container healthcheck and Dokploy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/basic-auth.conf;
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Captions. nginx's default mime.types has no entry for .vtt, and browsers ignore a
    # <track> served with the wrong type.
    location ~* \.vtt$ {
        include /etc/nginx/basic-auth.conf;
        include /etc/nginx/security-headers.conf;
        types { }
        default_type text/vtt;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Course videos and posters. nginx serves byte ranges, so the player can seek.
    location /media/ {
        include /etc/nginx/basic-auth.conf;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The SCORM sample package (html, js, css, imsmanifest.xml). Not hashed, so revalidate.
    location /scorm/ {
        include /etc/nginx/basic-auth.conf;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Client-side routes all fall back to the SPA shell, which is never cached so a new
    # deploy shows up on the next load.
    location / {
        include /etc/nginx/basic-auth.conf;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
